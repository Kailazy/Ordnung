name: Genre DB

# Build the prebuilt Discogs genre database and publish it as a release asset,
# so the app downloads a few hundred MB instead of the ~10 GB monthly dump.
# The dump is CC0, so redistributing this derived table is fine. The asset
# lives on the rolling `genredb` prerelease tag, always at:
#   https://github.com/Kailazy/Ordnung/releases/download/genredb/discogs-genres.db.gz
#
# Manual-only, and currently expected to FAIL from GitHub runners: Cloudflare
# serves data.discogs.com's downloads a JS challenge on datacenter IPs
# (cf-mitigated: challenge), which no plain HTTP client passes, and the S3
# bucket behind it denies anonymous reads. Until Discogs offers a
# datacenter-reachable source, refresh the asset from a residential
# connection with `make genredb-publish` instead. Kept as dispatch-only so
# the probe can be retried cheaply if that ever changes — a monthly cron
# here would just be a monthly red X.
on:
  workflow_dispatch:

permissions:
  contents: write   # create/refresh the `genredb` release and its asset

jobs:
  build-genredb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-genredb-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-genredb-

      # Resolve the newest dump by probing recent month stamps (dumps are dated
      # the 1st) and checking for the gzip magic bytes. Done in shell so a
      # blocked or redirected response is visible in the log, not a bare error.
      - name: Find the latest dump
        run: |
          set -uo pipefail
          for m in 0 1 2 3; do
            stamp=$(date -u -d "$(date -u +%Y-%m-15) -$m month" +%Y%m01)
            year=${stamp:0:4}
            url="https://data.discogs.com/?download=data%2F${year}%2Fdiscogs_${stamp}_releases.xml.gz"
            magic=$(curl -sL --max-time 30 "$url" 2>/dev/null | head -c 2 | xxd -p || true)
            echo "probe $stamp -> magic=${magic:-none}"
            if [ "$magic" = "1f8b" ]; then
              echo "DUMP_STAMP=$stamp" >> "$GITHUB_ENV"
              echo "DUMP_URL=$url" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "no dump reachable; response to the listing page for diagnosis:"
          curl -s -D - --max-time 30 "https://data.discogs.com/?prefix=data%2F$(date -u +%Y)%2F" | head -c 2000
          exit 1

      # Streams the ~10 GB dump (never written to disk) into the SQLite table.
      - name: Build the genre database from the latest dump
        run: cargo run --release -p ordnung-core --example build_genredb -- discogs-genres.db "$DUMP_STAMP" "$DUMP_URL"

      - name: Compress
        run: |
          gzip -9 discogs-genres.db
          ls -lh discogs-genres.db.gz

      - name: Publish to the rolling `genredb` release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view genredb --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create genredb --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Discogs genre database" \
              --notes "Rolling prebuilt genre database, regenerated monthly from the Discogs data dump (CC0). Downloaded automatically by Ordnung's genre-database import."
          gh release upload genredb discogs-genres.db.gz --repo "$GITHUB_REPOSITORY" --clobber
